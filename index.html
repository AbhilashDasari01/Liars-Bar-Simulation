<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Experience the thrill of Liar's Bar Russian Roulette with multiple revolvers. Load the revolvers, pull the trigger, and test your luck in this classic high-stakes game of chance. Will you survive?" />
  <title>Multi-Revolver Russian Roulette Simulation</title>


  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Rye&display=swap" rel="stylesheet" />  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <!-- Styles -->
  <link rel="stylesheet" href="./resources/css/style.css" />

  
</head>

  <body>

    <div class="container">

      <h1>Liar's Bar</h1>
      <h2>Multi-Revolver Russian Roulette Simulation</h2>

      <div class="card-container">
          <div class="card" id="card" onclick="randomCard()">?</div>
    </div>



    <!-- Revolver Management Section -->
    <div class="revolver-management">
      <div class="add-revolver-section">
        <input type="text" id="revolverNameInput" placeholder="Enter revolver name..." maxlength="20">
        <button class="add-btn" onclick="addRevolver()">Add Revolver</button>
      </div>

      <!-- Revolver Tabs -->
      <div class="revolver-tabs" id="revolverTabs">
        <!-- Tabs will be dynamically generated -->
      </div>
    </div>
    <!-- Game Area Container -->
    <div id="gameContainer">
      <!-- Game areas will be dynamically generated -->
    </div>

    <!-- Sounds -->
    <audio id="clickSound" src="resources/media/sounds/wind.m4a" preload="auto"></audio>
    <audio id="chimeSound" src="resources/media/sounds/chime.m4a" preload="auto"></audio>
    <audio id="gunshotSound" src="resources/media/sounds/headshot.m4a" preload="auto"></audio>
    <audio id="emptyClickSound" src="resources/media/sounds/quack.m4a" preload="auto"></audio>
    <audio id="spinSound" src="resources/media/sounds/revolver-spin.mp3" preload="auto"></audio>
    <audio id="bruhSound" src="resources/media/sounds/bruh.m4a" preload="auto"></audio>
    

    <div class="damage-warning" id="damageOverlay"></div>
    
    <div id="blood-splatter-container">
